<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>MILK STAND — Voice Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #ffffff;
      --bg-2: #fafafa;
      --bg-3: #f4f4f4;
      --ink: #0a0a0a;
      --ink-2: #1a1a1a;
      --mute: #767676;
      --mute-2: #a8a8a8;
      --line: #eaeaea;
      --line-soft: #f0f0f0;
      --blue: #0047ff;
      --blue-ink: #0036c5;
      --blue-soft: #ecf0ff;
      --danger: #d83a3a;
      --ok: #1f8a5b;
      --radius: 10px;
      --shadow-sm: 0 1px 0 rgba(10, 10, 10, 0.04);
      --shadow-md: 0 8px 32px rgba(10, 10, 10, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans JP", "Inter", system-ui, sans-serif;
      font-feature-settings: "palt";
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0.01em;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; letter-spacing: inherit; }
    .mono { font-family: "DM Mono", "Inter", monospace; letter-spacing: 0.04em; }
    .num { font-variant-numeric: tabular-nums; }
    #root { min-height: 100%; }
  </style>
</head>
<body style="background-color: rgb(255, 255, 247)">
  <div id="root"></div>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="tweaks-panel.jsx" type="text/babel"></script>
  <script src="data.js" type="text/babel"></script>
  <script src="components.jsx" type="text/babel"></script>
  <script src="screens.jsx" type="text/babel"></script>
  <script src="app.jsx" type="text/babel"></script>
</body>
</html>
